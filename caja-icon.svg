    <rect x="140" y="288" width="60" height="46" rx="10"/>
    <rect x="226" y="288" width="60" height="46" rx="10"/>
    <rect x="312" y="288" width="60" height="46" rx="10"/>
  </g>
  <rect x="176" y="104" width="160" height="46" rx="12" fill="#2b3644"/>
